---
# This is a sample configuration file used to set up configurations for demo. You will need to make a copy of this configuration file
# and change it as necessary. 
# IMPORTANT: When editting this configuration file, make sure to keep all data types the same. For example, if a value is a string,
# use a string. For some items, null values are usable.
# You do not need prior experience with YML to modify this file, but a tutorial is stored here https://www.cloudbees.com/blog/yaml-tutorial-everything-you-need-get-started

# WARNING: If you use relative paths will be relative to the directory in the terminal where you run the code from, which may change
# For the demo, run the code while the main swaxs_data_reduction directory since relative paths are used. This will change
# To avoid this confusion, absolute paths (starts with /) are generally recommended after completing the demo.
data_directory: "demo/2D"
poni_directory: "demo/poni"
# Specify PONI files and mask files within poni directory above. Do not give an absolute path.
poni_files:
  saxs: "atT_SAXS.poni"
  waxs: "atT_WAXS.poni"
# Mask files are assumed to be in poni directory
# Null if you do not want to use mask correction
mask_files:
  saxs: "RT_SAXS_mask_03.edf"
  waxs: null
# Detector dimensions (pixels). List formatted as [num rows, num columns]
detector_shapes:
  saxs: [1043, 981]
  waxs: [195, 487]
# Compound is used with pt library to compute sld
compound: "C2H4"
# 1D Integration parameters
npt_radial: 1000  # Number of radial bins
error_model: "poisson"  # Error propagation model
# Experimental parameters (from Step1 notebook)
energy_keV: 12
density_g_cm3: 0.92
i0_offset: 0.0  
bstop_offset: 0.0 
i0_air: 0.0 
bstop_air: 0.0
mode: "SWAXS" # Options: "SAXS", "WAXS", or "SWAXS" (both SAXS and WAXS)
metadata_format: "csv" # Options: "csv" or "pdi"
# Thickness in meters. If null, compute it
thickness: null

# IMPORTANT: 1-5 and raw is the only supported combination currently
# INPUT: Raw data file path, OUTPUT: int32 reshaped dataframe of processed data
beamline: 
  type: "1-5" 
  data_format: "raw"

# Below functions are used in place of existing functions.
# IMPORTANT: Make sure to specify function name and add function code in utils.py
# IMPORTANT: follow input and output in exactly the same way as noted below
# Provide a different reading metadata function if not reading CSV or PDI
# INPUT: raw data file path. Output: Tuple (i0, bstop, csv_dir). 
read_metadata_function: null


